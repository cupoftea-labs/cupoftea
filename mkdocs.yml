site_name: CupOfTea
site_description: Lightweight, modular, and high-performance columnar data manipulation library for Java.
site_author: CupOfTea Contributors
site_url: https://cupoftea-labs.github.io/cupoftea/
repo_url: https://github.com/cupoftea-labs/cupoftea
repo_name: CupOfTea

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart Tutorial: getting-started/quickstart.md
  - Architecture & Core:
      - Columnar Engine: core/columnar-engine.md
      - Schema & Types: core/schema-and-types.md
      - Mutation Modes: core/mutation-modes.md
      - Row & DataFrame API: core/dataframe-api.md
      - Indexing (loc & iloc): core/indexing.md
      - Filtering & Sorting: core/filtering-sorting.md
      - GroupBy & Aggregations: core/groupby-aggregations.md
      - Null & Missing Value Policy: core/null-policy.md
  - Modules & IO Formats:
      - Overview & SPI: formats/overview.md
      - CSV: formats/csv.md
      - JSON: formats/json.md
      - Excel: formats/excel.md
      - Parquet: formats/parquet.md
      - HTML: formats/html.md
      - YAML: formats/yaml.md
      - XML: formats/xml.md
  - Organization & Community:
      - Contributing Guide: community/contributing.md
      - Performance & Benchmarks: community/benchmarks.md
      - Versioning & Releases: community/versioning.md
      - Release Guide & Procedures: community/releasing.md
      - Changelog: community/changelog.md
      - Repository Migration: community/organization-migration.md
  - API Reference (Javadoc): javadoc.md
