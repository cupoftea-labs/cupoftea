name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Benchmark target preset (micro, io, pipeline, scaling, competitive, all)'
        required: true
        default: 'micro'
  pull_request:
    types: [labeled, opened, synchronize]

jobs:
  benchmark:
    name: Run JMH Benchmarks
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package Benchmarks JAR
        run: mvn -B clean package -pl cupoftea-benchmark -am -DskipTests

      - name: Run JMH Benchmark Suite
        run: |
          TARGET="${{ github.event.inputs.target || 'micro' }}"
          echo "Running benchmark target: $TARGET"
          java --add-opens=java.base/java.nio=ALL-UNNAMED \
               -jar cupoftea-benchmark/target/benchmarks.jar "$TARGET" \
               -rf json -rff jmh-results.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: jmh-results.json
