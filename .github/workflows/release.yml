name: Release & Publish to Maven Central

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (leave empty to infer from pom.xml)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Sign, Deploy & Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract project version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}, tag: ${TAG_NAME}"

      - name: Verify build and test suite
        run: mvn -B verify

      - name: Generate release notes
        id: extract_notes
        run: |
          TAG="${{ steps.get_version.outputs.TAG_NAME }}"
          echo "Generating comprehensive release notes for $TAG..."
          python3 .github/scripts/generate-release-notes.py \
            --new-tag "$TAG" \
            --changelog CHANGELOG.md \
            --output RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish to Maven Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "Publishing release artifacts to Maven Central Portal..."
          mvn -B clean deploy -P release -DskipTests \
            -Dgpg.passphrase="${GPG_PASSPHRASE}"

      - name: Create or Update Git Tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG_NAME }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating git tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          # Gather release artifacts from target directories
          ASSETS=()
          for jar in cupoftea-*/target/*.jar target/*.jar; do
            if [ -f "$jar" ] && [[ ! "$jar" == *"original-"* ]]; then
              ASSETS+=("$jar")
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes and assets..."
            gh release edit "$TAG" --title "Release $TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating new GitHub release for $TAG..."
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "Release $TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
